name: Payment PR CI

on:
  pull_request:
    branches:
      - dev

jobs:
  ci:
    runs-on: self-hosted

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Check Java
        run: java -version

      - name: Check Maven
        run: mvn -version

      - name: Build Java application
        run: mvn clean package

      - name: Check JAR file
        run: ls -lh target/

      - name: Build Docker image
        run: |
          docker build -t payment-app:${{ github.sha }} .

      - name: Remove old container
        run: |
          docker rm -f payment-app || true

      - name: Run container
        run: |
          docker run -d \
            --name payment-app \
            -p 8080:8080 \
            payment-app:${{ github.sha }}

      - name: Check running container
        run: |
          docker ps
          docker logs --tail 50 payment-app
