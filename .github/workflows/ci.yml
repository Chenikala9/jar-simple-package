name: govardhan  first workflow

on:
  push:
    branches:
      - feauture/login

jobs:
  package_jar_build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Check Java
        run: java -version

      - name: Build with Maven
        run: mvn clean package
